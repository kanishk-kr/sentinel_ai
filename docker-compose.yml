version: '3.8'

services:
  # ── Backend API Gateway & Services ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=sentinel_admin
      - DB_PASS=sentinel_secure_pass_2026
      - DB_NAME=sentinel_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - SOVEREIGN_MODE=true
    env_file:
      - .env
    volumes:
      - sentinel_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - sentinel_net

  # ── Frontend Web App ──
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - sentinel_net

  # ── Database (PostgreSQL) ──
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sentinel_admin
      - POSTGRES_PASSWORD=sentinel_secure_pass_2026
      - POSTGRES_DB=sentinel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/configs/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_net

  # ── Vector Database (Qdrant) ──
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sentinel_net

  # ── In-Memory Cache & Message Broker (Redis) ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinel_net

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  sentinel_artifacts:

networks:
  sentinel_net:
    driver: bridge
